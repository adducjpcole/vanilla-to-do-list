<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    class="min-h-dvh bg-gradient-to-tl from-purple-950 to-indigo-950 text-neutral-100 flex items-center justify-center"
  >
    <main
      class="flex-1 bg-neutral-100 text-neutral-900 py-4 px-8 rounded max-w-3/4 my-16"
    >
      <h1 class="text-3xl font-extrabold my-8"> To-Do List 📃 </h1>

      <form
        id="task-adder"
        class="bg-neutral-200 flex flex-row justify-between rounded-full"
      >
        <input
          type="text"
          name="task-label"
          placeholder="Add your task"
          class="flex-1 ml-4 cursor-text flex flex-row outline-none"
        />
        <input
          type="submit"
          value="ADD"
          class="cursor-pointer bg-orange-600 self-end px-8 sm:px-12 py-4 rounded-full text-neutral-100 font-bold hover:bg-orange-400 active:bg-orange-800 transition-colors"
        />
      </form>

      <ul id="tasks" class="my-8 grid grid-cols-1"> </ul>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
