<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do List</title>
    <link rel="icon" type="image/x-icon" href="./public/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    class="min-h-dvh bg-gradient-to-tl from-neutral-300 to-slate-100 text-neutral-100 flex items-center justify-center"
  >
    <main
      class="flex-1 bg-neutral-100 text-neutral-900 py-4 px-8 rounded max-w-3/4 my-16 shadow-xl shadow-black/50"
    >
      <h1 class="text-3xl font-bold my-8"> To-Do List 📝 </h1>

      <form
        id="task-adder"
        class="relative bg-neutral-200 flex flex-row justify-between rounded-full"
      >
        <input
          type="text"
          name="task-label"
          placeholder="Add your task"
          class="flex-1 ml-4 cursor-text flex flex-row outline-none"
        />
        <input
          type="submit"
          value="Add"
          class="cursor-pointer bg-green-600 px-8 sm:px-12 py-4 rounded-full text-neutral-100 font-semibold hover:bg-green-400 active:bg-green-800 transition-colors"
        />
        <p
          id="error-display"
          class="absolute z-10 pointer-events-none left-0 top-0 bottom-0 self-center -translate-y-full p-2 bg-orange-600 text-neutral-100 rounded shadow-xl shadow-black/50 transition-all opacity-0"
        >
        </p>
      </form>

      <ul id="tasks" class="my-8 grid grid-cols-1"> </ul>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
